apiVersion: batch/v1
kind: Job
metadata:
  name: 'synthseg-job'
  namespace: mario-verdicchio
spec:
  completions: 1299
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 50
  backoffLimitPerIndex: 2
  maxFailedIndexes: 50
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - kubelet-5 
      containers:
        - name: freesurfer
          image: registry.sdn/freesurfer:8.1.0a
          command:
            - "bash"
            - "-c"
            - |
                line=$(sed -n "$((JOB_COMPLETION_INDEX+2))p" "/mnt/NAS-Progetti/BrainAtrophy/code/csv/all_to_process_synthseg.csv")
                IFS=',' read -r subject_id image_path output_path _ <<< "$line"
                bash /mnt/NAS-Progetti/BrainAtrophy/code/synthseg_run.sh "$subject_id" "$image_path" "$output_path" 4
          resources:
            requests:
              memory: "14Gi"
              cpu: "4"
            limits:
              memory: "36Gi"
              cpu: "6"
          volumeMounts:
            - name: my-volume
              mountPath: "/mnt/NAS-Progetti"
      volumes:
        - name: my-volume
          persistentVolumeClaim:
            claimName: pvc-progetti-claim

  